version: 1.0
build:
  commands:
    pre-build:
      - corepack enable && corepack prepare pnpm@latest --activate
    build:
      - pnpm install --frozen-lockfile
      - NODE_OPTIONS="--max-old-space-size=4096" NODE_ENV=production pnpm build
      - cp -r public .next/standalone/ 2>/dev/null || true
      - mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
run:
  command: sh -c "cd .next/standalone && node server.js"
  network:
    port: 3000
    env: PORT
  env:
    - name: PORT
      value: "3000"
    - name: HOSTNAME
      value: "0.0.0.0"
    - name: NODE_ENV
      value: "production"

