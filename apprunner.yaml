version: 1.0
runtime: nodejs20
build:
  commands:
    pre-build:
      - corepack enable
      - corepack prepare pnpm@latest --activate
    build:
      - pnpm install --frozen-lockfile
      - export NODE_OPTIONS="--max-old-space-size=4096"
      - NODE_ENV=production pnpm build
      - cp -r public .next/standalone/ || true
      - cp -r .next/static .next/standalone/.next/static || true
run:
  runtime-version: 20
  command: sh -c "cd .next/standalone && node server.js"
  network:
    port: 3000
    env: PORT
  env:
    - name: PORT
      value: "3000"
    - name: HOSTNAME
      value: "0.0.0.0"
    - name: NODE_ENV
      value: "production"

