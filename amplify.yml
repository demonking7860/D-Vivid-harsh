version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@9.0.0 --activate
        - pnpm install --frozen-lockfile

    build:
      commands:
        - npx next telemetry disable
        - export NODE_OPTIONS="--max-old-space-size=4096"
        # Inject Amplify Console env vars into .env.production immediately before build
        # (required for Next.js SSR/API routes on Amplify compute — see AWS SSR env docs)
        - echo "Build env var names present (values hidden):"
        - env | cut -d= -f1 | grep -E '^(OPENROUTER|PERPLEXITY|S3|CLERK|GOOGLE|NEXT_PUBLIC|APP_)' | sort || echo "(none matched — check Amplify Console > Hosting > Environment variables)"
        - echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> .env.production
        - env | grep -e PERPLEXITY_API_KEY -e CLERK_SECRET_KEY -e GOOGLE_SERVICE_ACCOUNT_KEY -e GOOGLE_SHEET_ID -e S3_BUCKET >> .env.production
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - echo "AWS_REGION=$APP_REGION" >> .env.production
        - grep -q '^OPENROUTER_API_KEY=.\+' .env.production || (echo "FATAL OPENROUTER_API_KEY is empty. In Amplify Console go to Hosting > Environment variables, add OPENROUTER_API_KEY for branch main (or All branches), paste the full sk-or-v1-... key, Save, then Redeploy." && exit 1)
        - echo "OPENROUTER_API_KEY length in .env.production:" $(grep '^OPENROUTER_API_KEY=' .env.production | cut -d= -f2 | wc -c)
        - NODE_ENV=production pnpm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

permissions:
  s3:
    - bucket: dvividpdfreport
      prefix: "*"
      access: readwrite
