version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@9.0.0 --activate
        - pnpm install --frozen-lockfile

    build:
      commands:
        - npx next telemetry disable
        - export NODE_OPTIONS="--max-old-space-size=4096"
        # Inject Amplify Console env vars into .env.production immediately before build.
        # Amplify does not pass console env vars to Next.js SSR/API routes by default, so
        # they must be written here (right before next build). See AWS SSR env docs.
        - env | grep -e OPENROUTER_API_KEY -e CLERK_SECRET_KEY -e GOOGLE_SERVICE_ACCOUNT_KEY -e GOOGLE_SHEET_ID -e S3_BUCKET >> .env.production
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - echo "AWS_REGION=$APP_REGION" >> .env.production
        - 'test -n "$OPENROUTER_API_KEY" || (echo "FATAL OPENROUTER_API_KEY is empty - set it in Amplify Console Hosting Environment variables (full sk-or-v1 key) for branch main or All branches, then redeploy" && exit 1)'
        - 'echo "OPENROUTER_API_KEY length" ${#OPENROUTER_API_KEY}'
        - NODE_ENV=production pnpm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

permissions:
  s3:
    - bucket: dvividpdfreport
      prefix: "*"
      access: readwrite
