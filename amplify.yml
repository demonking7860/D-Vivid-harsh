version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@9.0.0 --activate
        - pnpm install --frozen-lockfile

    build:
      commands:
        - npx next telemetry disable
        - export NODE_OPTIONS="--max-old-space-size=4096"
        # Inject Amplify Console env vars into .env.production immediately before build
        # (required for Next.js SSR/API routes on Amplify compute — see AWS SSR env docs)
        - env | grep -e OPENROUTER_API_KEY -e PERPLEXITY_API_KEY -e CLERK_SECRET_KEY -e GOOGLE_SERVICE_ACCOUNT_KEY -e GOOGLE_SHEET_ID -e S3_BUCKET >> .env.production
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - echo "AWS_REGION=$APP_REGION" >> .env.production
        - test -n "$OPENROUTER_API_KEY" || (echo "FATAL OPENROUTER_API_KEY is empty in Amplify build env" && exit 1)
        - echo "OPENROUTER_API_KEY length check:" ${#OPENROUTER_API_KEY}
        - NODE_ENV=production pnpm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

permissions:
  s3:
    - bucket: dvividpdfreport
      prefix: "*"
      access: readwrite
